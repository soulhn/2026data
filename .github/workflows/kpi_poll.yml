name: KPI poll (15분 · 외부 트리거)

# 예약 실행(schedule)은 GitHub가 자주 누락·지연시켜 실제로는 하루 2회만 돌았다 (docs/DEV_LOG.md 2026-09-16).
# 그래서 이 워크플로는 예약 없이 외부에서 호출한다:
#   · cron-job.org → workflow_dispatch API  (15분마다)
#   · 노션 자동화 → 중계(supabase/functions/notion-relay) → workflow_dispatch API  (최종결과 바뀌는 즉시)
# 둘 다 토큰 권한은 Actions: write 하나면 된다. 설정 절차: recruit-kpi/docs/SETUP_REALTIME.md
# 한화 출결(hrd_etl.py)은 무거워서 여기 없다 — hrd_etl.yml이 따로 돈다.

on:
  workflow_dispatch:

concurrency:
  group: kpi-poll
  cancel-in-progress: false   # 겹치면 줄 세운다 (같은 DB에 동시에 쓰지 않도록)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Roster snapshot (HRD 명부 · 승인/이탈 감지)
        env:
          HRD_API_KEY: ${{ secrets.HRD_API_KEY }}
          ENCORE_API_KEY: ${{ secrets.ENCORE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u kpi_etl.py

      - name: Notion applicants (최종결과 전이 감지)
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u notion_applicants_etl.py

      - name: Publish Notion KPI page
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u notion_kpi_publish.py
