name: KPI poll (노션 웹훅 트리거)

# 예약 없음. 노션 API 웹훅 → supabase/functions/notion-relay(최종결과가 HRD등록으로 바뀐 경우만) → workflow_dispatch 로 즉시 실행.
# 정기 실행은 hrd_etl.yml(하루 2회 실측)이 계속 맡는다. 토큰 권한은 Actions: write 하나. 설정 절차: recruit-kpi/docs/SETUP_REALTIME.md
# 한화 출결(hrd_etl.py)은 무거워서 여기 없다.

on:
  workflow_dispatch:

concurrency:
  group: kpi-poll
  cancel-in-progress: false   # 겹치면 줄 세운다 (같은 DB에 동시에 쓰지 않도록)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Roster snapshot (HRD 명부 · 승인/이탈 감지)
        env:
          HRD_API_KEY: ${{ secrets.HRD_API_KEY }}
          ENCORE_API_KEY: ${{ secrets.ENCORE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u kpi_etl.py --kpi-only   # AI캠퍼스 9회차만 (전체 72회차는 hrd_etl.yml이 하루 2회)

      - name: Notion applicants (최종결과 전이 감지)
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u notion_applicants_etl.py

      - name: Publish Notion registry page (HRD 등록자 관리)
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u notion_registry_publish.py
