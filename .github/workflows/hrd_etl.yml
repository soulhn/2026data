name: HRD ETL (매시간)

on:
  schedule:
    # UTC 기준: KST 09:00~18:00 = UTC 00:00~09:00
    # 평일 매시간 실행
    - cron: '10 0-9 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HRD ETL
        env:
          HRD_API_KEY: ${{ secrets.HRD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MARKET: ${{ secrets.DATABASE_URL_MARKET }}
        run: python -u hrd_etl.py

      - name: Run KPI round snapshot ETL
        if: always()   # 출결 ETL이 실패해도 스냅샷은 남긴다
        env:
          HRD_API_KEY: ${{ secrets.HRD_API_KEY }}
          ENCORE_API_KEY: ${{ secrets.ENCORE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u kpi_etl.py

      - name: Run Notion applicants ETL
        if: always()   # NOTION_TOKEN 이 없으면 스크립트가 스스로 건너뛴다
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u notion_applicants_etl.py
